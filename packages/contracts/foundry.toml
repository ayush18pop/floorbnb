[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./holidays" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./script/params" }, { access = "read", path = "./test/fixtures" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
ignore = ["src/libs/vendor/*.sol"]
number_underscore = "thousands"

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
