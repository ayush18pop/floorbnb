<title id="t">Agent flow: MCP, b402, keeper</title><desc id="d">An AI agent calls the Floor MCP server and pays per call through b402. A keeper wallet calls rebalance on the vault on BNB Smart Chain, which swaps on PancakeSwap and BSC liquidity.</desc>
