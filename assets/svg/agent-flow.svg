)"/><text x="252" y="120" class="s">1 TOOL CALL</text><text x="252" y="176" class="s">2 HTTP 402</text><path class="s-ink" d="M576 128L720 128" fill="none" stroke-width="1.2" marker-end="url(#ar)"/><path class="s-ink" d="M720 160L576 160" fill="none" stroke-width="1.2" marker-end="url(#ar)"/><text x="588" y="120" class="s">3 SIGNED PAY</text><text x="588" y="176" class="s">4 SETTLED</text><path class="s-ink" d="M480 192L480 288" fill="none" stroke-width="1.2" marker-end="url(#ar)"/><text x="492" y="236" class="s">READS VAULT</text><text x="492" y="250" class="s">STATE</text><path class="s-accent" d="M240 336L384 336" fill="none" stroke-width="1.2" marker-end="url(#aa)"/><text x="252" y="328" class="s a">rebalance()</text><path class="s-ink" d="M576 336L720 336" fill="none" stroke-width="1.2" marker-end="url(#ar)"/><text x="588" y="328" class="s">SWAPS</text><text x="48" y="432" class="s">USER FUNDS STAY IN THE VAULT CONTRACT, NEVER IN THE KEEPER WALLET.</text><text x="48" y="450" class="s">b402 PAYS FOR FLOOR API CALLS. IT DOES NOT PAY FOR LLM INFERENCE.</text></svg>
